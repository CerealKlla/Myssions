license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

description='''
Quest system: a player-facing quest log UI, Active Quest HUD, waypoint hints, and a public API
(api.Myssions) letting other mods register quest definitions and assign/grant them to players.
'''

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- waypoint hints (vague-location circles, auto-removed/recalculated
# based on the player's own knowledge quality) are rendered through Cartographyr's minimap if
# present; the mod works standalone without it, just with no map markers for quest locations.
[[dependencies.${mod_id}]]
    modId="cartographyr"
    type="optional"
    reason="Renders quest location waypoints (vague-circle hints) on the minimap if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- a settlement's Mayor is a natural future quest Issuer (e.g.
# commissioning a road to a neighboring settlement); the mod works standalone without it.
[[dependencies.${mod_id}]]
    modId="settlemynts"
    type="optional"
    reason="Lets a settlement's Mayor act as a quest Issuer if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- a quest reward can grant Lyfe skill XP if present.
[[dependencies.${mod_id}]]
    modId="lyfe"
    type="optional"
    reason="Lets a quest reward grant Lyfe skill XP if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- a quest reward can grant gold (Gold Nuggets via Yconomics' economy)
# if present.
[[dependencies.${mod_id}]]
    modId="yconomics"
    type="optional"
    reason="Lets a quest reward grant gold if present."
    ordering="NONE"
    side="BOTH"

# Optional soft dependency -- an "entrance quest" (design doc item 4, "go find a troll within a
# cave") spawns a real TinyWyrlds Wyrld Entrance if present; the mod works standalone without it,
# just without that one quest shape available.
[[dependencies.${mod_id}]]
    modId="tinywyrlds"
    type="optional"
    reason="Lets an entrance-type quest spawn a real Wyrld Entrance dungeon if present."
    ordering="NONE"
    side="BOTH"

# Nuclyus is the suite's foundation mod -- required (not optional) for every mod, starting with the
# cross-mod menu-contribution system (see Nuclyus' own CLAUDE.md).
[[dependencies.${mod_id}]]
    modId="nuclyus"
    type="required"
    reason="Foundation mod for shared base classes/contracts across the suite."
    ordering="AFTER"
    side="BOTH"
